<!doctype html><html><head><meta charset="utf-8">
<!-- The family's social card (1200 x 630), Kara Duman. Render with headless Chrome:
     google-chrome-stable --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png og-card.html
     Per-site cards keep the frame; the site name replaces the line. Artwork is read from ../art/. -->
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800;900&family=Spectral:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0D0C0A;color:#E8E0CE;overflow:hidden;position:relative;font-family:Spectral,Georgia,serif}
.plume{position:absolute;right:0;top:-10px;height:660px}
.mark{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:20px;font:800 34px/1 "Grenze Gotisch",serif}
.mark img{width:64px;height:64px}
h1{position:absolute;left:68px;top:176px;font:900 118px/1 "Grenze Gotisch",serif}
p{position:absolute;left:72px;top:438px;font-size:31px;line-height:1.35;max-width:560px}
</style></head><body>
<img class="plume" src="../art/plume.webp" alt="">
<div class="mark"><img src="../art/emblem.webp" alt="">arda.tr</div>
<h1>Arda<br>Karaduman</h1>
<p>Systems architect in Tokyo. Software, games and black metal.</p>
</body></html>
