<!doctype html><html><head><meta charset="utf-8">
<!-- The family's social card (1200 x 630), Kara Duman. Render with headless Chrome:
     google-chrome-stable --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png og-card.html
     Per-site cards keep the frame; the site name replaces the line. Artwork is read from ../art/. -->
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800;900&family=Spectral:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0D0C0A;color:#E8E0CE;overflow:hidden;position:relative;font-family:Spectral,Georgia,serif}
.plume{position:absolute;right:0;top:-10px;height:660px}
.mark{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:20px;font:800 34px/1 "Grenze Gotisch",serif}
.mark img{width:64px;height:64px}
h1{position:absolute;left:68px;top:176px;font:900 118px/1 "Grenze Gotisch",serif}
.site{font:400 30px/1 Spectral,serif;color:#9A9384;margin-left:4px}
/* The résumé: bone paper, no artwork; the emblem keeps its soot ground. */
.paper{background:#E8E0CE;color:#0D0C0A}
.paper .plume{display:none}
.paper .mark img{background:#0D0C0A;border-radius:50%}
.paper .site{color:#5C574C}
p{position:absolute;left:72px;top:438px;font-size:31px;line-height:1.35;max-width:560px}
</style></head><body>
<img class="plume" src="../art/plume.webp" alt="">
<div class="mark"><img src="../art/emblem.webp" alt="">arda.tr</div>
<h1>Arda<br>Karaduman</h1>
<p>Systems architect in Tokyo. Software, games and black metal.</p>
<script>
/* og-card.html?site=blog | resume | ai draws that site's card. */
const cards = {
  blog:   {site: "blog", h1: "Blog", p: "Notes on AI tooling, Go, DevOps, home networking, and generative music."},
  resume: {site: "r\u00e9sum\u00e9", h1: "Arda<br>Karaduman", p: "AI Platform & Backend Systems Architect. Go, Ruby, Python, MCP, AWS, GCP.", paper: true},
  ai:     {site: "ask", h1: "Ask about<br>Arda", p: "Answers questions about Arda\u2019s work, projects, and music.", art: "../art/wisp.webp"},
};
const c = cards[new URLSearchParams(location.search).get("site")];
if (c) {
  document.querySelector(".mark").insertAdjacentHTML("beforeend", `<span class="site">${c.site}</span>`);
  document.querySelector("h1").innerHTML = c.h1;
  document.querySelector("p").textContent = c.p;
  if (c.art) document.querySelector(".plume").src = c.art;
  if (c.paper) document.body.classList.add("paper");
}
</script>
</body></html>
