name: Theme contract freshness

# config/themes.json is the family's brand contract (v4, "The Index"): the hashes
# of brand/arda.css, arda.js, brand.css and scheme.js, read by the sibling sites
# (blog, résumé, ai) via raw.githubusercontent.com to check their copies.
# This check fails when the committed contract or brand/'s copy of the built
# theme is stale relative to themes/arda/ and brand/. It is a separate workflow
# on purpose: a stale contract must never block Pages deploys.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Run JavaScript actions on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Regenerate theme contract
        # The generator only uses node built-ins, so `npm ci` is not needed.
        run: node scripts/generate-themes-contract.mjs
      - name: Fail if the committed contract is stale
        run: git diff --exit-code config/themes.json brand/
