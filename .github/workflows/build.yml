name: Build check

# The site is deployed by hand to a Cloudflare Worker (tools/deploy_cloudflare.sh).
# This only checks that it still verifies and builds, before anyone deploys.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Run JavaScript actions on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the sitemap's <lastmod> is the last commit that
          # touched the content (scripts/generate-sitemap.mjs), which a
          # shallow clone cannot see.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Build
        run: npm run build
